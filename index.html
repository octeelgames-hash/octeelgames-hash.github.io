<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Octeel Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Fredoka', sans-serif;
    background: linear-gradient(#a8e6cf, #dcedc1);
    text-align:center;
    color:#2d3436;
}

header{
    padding:80px 20px;
}

h1{
    font-size:60px;
    margin:0;
}

.tagline{
    font-size:20px;
    margin-top:10px;
}

.hero-button{
    margin-top:30px;
    padding:14px 28px;
    background:#ffcc70;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.hero-button:hover{
    background:#ffb347;
}

.section{
    padding:70px 20px;
}

.game-card{
    background:white;
    max-width:600px;
    margin:30px auto;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.game-card h2{
    margin-top:0;
    font-size:32px;
}

.steam-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#55efc4;
    border-radius:25px;
    text-decoration:none;
    color:#2d3436;
    font-weight:600;
    transition:0.3s;
}

.steam-btn:hover{
    background:#2ecc71;
    color:white;
}

footer{
    padding:30px;
    background:#81ecec;
    margin-top:60px;
}
</style>
</head>

<body>

<header>
    <h1>🌱 Octeel Games 🎉</h1>
    <p class="tagline">Co-op Farming Adventures with Friends!</p>
    <button class="hero-button">Play Together!</button>
</header>

<div class="section">
    <h2>🎮 Our Game</h2>

    <div class="game-card">
        <h2>PartyHarvest 🌽</h2>
        <p>Grow crops, decorate your farm, and party with friends in a colorful co-op farming world!</p>
        <a href="#" class="steam-btn">Coming Soon on Steam</a>
    </div>
</div>

<footer>
    © 2026 Octeel Games • Made with 🌾 & 🎉
</footer>

</body>
</html>
