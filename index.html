<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO -->
<title>PartyHarvest - Cozy Co-op Farming Game</title>
<meta name="description" content="PartyHarvest is a colorful co-op farming adventure by Octeel Games. Grow crops, decorate your farm, and play together with friends.">
<meta name="keywords" content="PartyHarvest, farming game, co-op game, multiplayer farming, indie game">
<meta name="author" content="Octeel Games">

<meta property="og:title" content="PartyHarvest - Co-op Farming Fun">
<meta property="og:description" content="Grow crops. Play together. Party forever!">
<meta property="og:image" content="hero.png">
<meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins', sans-serif;
  scroll-behavior:smooth;
  background:#fff;
  color:#222;
}

section{
  padding:80px 20px;
  text-align:center;
  opacity:0;
  transform:translateY(40px);
  transition:all 0.8s ease;
}

section.show{
  opacity:1;
  transform:translateY(0);
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  top:0;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
  z-index:1000;
}

.logo{
  font-weight:600;
  font-size:20px;
}

nav ul{
  display:flex;
  gap:20px;
  list-style:none;
}

nav a{
  text-decoration:none;
  color:#222;
}

/* HAMBURGER */
.hamburger{
  display:none;
  font-size:26px;
  cursor:pointer;
}

.mobile-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:70%;
  height:100%;
  background:#fff;
  padding:40px;
  transition:0.4s;
  box-shadow:-5px 0 15px rgba(0,0,0,0.2);
}

.mobile-menu.active{
  right:0;
}

.mobile-menu a{
  display:block;
  margin-bottom:20px;
  font-size:18px;
}

/* HERO PARALLAX */
.hero{
  height:100vh;
  background:url("hero.png") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  text-align:center;
}

.hero .overlay{
  background:rgba(0,0,0,0.4);
  padding:40px;
  border-radius:20px;
}

.hero h1{
  font-size:60px;
}

.btn{
  margin-top:20px;
  padding:12px 30px;
  background:#ffce00;
  border-radius:30px;
  font-weight:600;
  display:inline-block;
  text-decoration:none;
  color:#000;
}

/* TRAILER */
iframe{
  width:90%;
  max-width:840px;
  height:470px;
  border-radius:20px;
  border:none;
}

/* GALLERY */
.gallery{
  display:flex;
  gap:30px;
  justify-content:center;
  flex-wrap:wrap;
}

.gallery img{
  width:300px;
  border-radius:20px;
  transition:0.3s;
}

.gallery img:hover{
  transform:scale(1.05);
}

/* STEAM STYLE SECTION */
.store{
  background:#1b2838;
  color:#fff;
}

.store-box{
  max-width:900px;
  margin:auto;
  background:#2a475e;
  padding:40px;
  border-radius:20px;
}

.store h3{
  font-size:28px;
}

.store .price{
  font-size:22px;
  margin:15px 0;
}

.store .wishlist{
  background:#66c0f4;
  padding:12px 25px;
  border-radius:8px;
  color:#000;
  font-weight:600;
  display:inline-block;
  text-decoration:none;
}

/* MOBILE */
@media (max-width:768px){
  nav ul{display:none}
  .hamburger{display:block}
  .hero h1{font-size:36px}
  iframe{height:250px}
  .gallery img{width:90%}
}

footer{
  padding:30px;
  text-align:center;
  background:#f1f1f1;
}

</style>
</head>

<body>

<nav>
  <div class="logo">Octeel Games</div>
  <ul>
    <li><a href="#hero">Home</a></li>
    <li><a href="#trailer">Trailer</a></li>
    <li><a href="#screens">Screenshots</a></li>
    <li><a href="#store">Store</a></li>
  </ul>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="#hero" onclick="toggleMenu()">Home</a>
  <a href="#trailer" onclick="toggleMenu()">Trailer</a>
  <a href="#screens" onclick="toggleMenu()">Screenshots</a>
  <a href="#store" onclick="toggleMenu()">Store</a>
</div>

<section id="hero" class="hero">
  <div class="overlay">
    <h1>PartyHarvest 🌽</h1>
    <p>Grow crops. Play together. Party forever!</p>
    <a href="#" class="btn">Wishlist on Steam</a>
  </div>
</section>

<section id="trailer">
  <h2> Official Trailer</h2>
  <iframe src="https://www.youtube.com/embed/cIubERFNhh8" allowfullscreen></iframe>
</section>

<section id="screens">
  <h2> Screenshots</h2>
  <div class="gallery">
    <img src="hero.png">
    <img src="hero.png">
    <img src="hero.png">
  </div>
</section>

<section id="store" class="store">
  <div class="store-box">
    <h3>PartyHarvest on Steam</h3>
    <p class="price">Coming Soon</p>
    <a href="#" class="wishlist">Add to Wishlist</a>
  </div>
</section>

<footer>
© 2026 Octeel Games
</footer>

<script>

function toggleMenu(){
  document.getElementById("mobileMenu").classList.toggle("active");
}

/* Fade-in on scroll */
const sections = document.querySelectorAll("section");
window.addEventListener("scroll", ()=>{
  sections.forEach(sec=>{
    const top = sec.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      sec.classList.add("show");
    }
  });
});

</script>

</body>
</html>
